<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flower — Emotional Display</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #05070f;
      font-family: 'Georgia', serif;
    }

    canvas {
      position: fixed;
      top: 0; left: 0;
      display: block;
    }

    /* Flower name overlay — fades in, then out */
    #label {
      position: fixed;
      bottom: 8vh;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
      z-index: 10;
    }
    #label.visible { opacity: 1; }
    #label .name {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 0 30px currentColor;
    }
    #label .sub {
      margin-top: 6px;
      font-size: clamp(0.7rem, 1.5vw, 0.9rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    /* Waiting state */
    #waiting {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(255,255,255,0.18);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      pointer-events: none;
      transition: opacity 1s ease;
      z-index: 5;
    }
    #waiting.hidden { opacity: 0; }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="flower"></canvas>

<div id="label">
  <div class="name" id="flowerName"></div>
  <div class="sub" id="flowerSub"></div>
</div>

<div id="waiting">Waiting for analysis…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<script>
// ══════════════════════════════════════════════════════════════════════
//  CONFIG — auto-detect server URL
//  Vite dev (5173) proxies /socket.io → backend, so use same origin.
//  TouchDesigner Web Browser COMP opens the built file directly →
//  connect straight to backend port 3001.
// ══════════════════════════════════════════════════════════════════════
const SERVER = (location.port === '5173' || location.port === '4173')
  ? window.location.origin
  : 'http://localhost:3001';

const FLOWER_META = {
  sunflower: { petals:12, petalColor:'#FFD700', centerColor:'#8B4513', stemColor:'#228B22', glowColor:'rgba(255,215,0,0.35)',   name:'ดอกทานตะวัน', sub:'SUNFLOWER' },
  lavender:  { petals:6,  petalColor:'#9B7DC4', centerColor:'#6A4C9C', stemColor:'#4A7C59', glowColor:'rgba(155,125,196,0.35)', name:'ดอกลาเวนเดอร์', sub:'LAVENDER'  },
  lotus:     { petals:8,  petalColor:'#FF6B9D', centerColor:'#FF1493', stemColor:'#2E8B57', glowColor:'rgba(255,107,157,0.35)', name:'ดอกบัว',         sub:'LOTUS'     },
  rose:      { petals:10, petalColor:'#E8335A', centerColor:'#C41E3A', stemColor:'#228B22', glowColor:'rgba(232,51,90,0.35)',   name:'ดอกกุหลาบ',      sub:'ROSE'      },
  daisy:     { petals:14, petalColor:'#FFFDE7', centerColor:'#FFC107', stemColor:'#388E3C', glowColor:'rgba(255,241,118,0.35)', name:'ดอกเดซี่',        sub:'DAISY'     },
};

// ══════════════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════════════
let W, H, cx, cy;
let frame = 0;
let animId = null;

// Smooth transition between two flower states
let current  = null;  // { meta, bloomScale, alpha }
let incoming = null;  // { meta, bloomScale, alpha }
let labelTimer = null;

// ══════════════════════════════════════════════════════════════════════
//  CANVAS SETUP
// ══════════════════════════════════════════════════════════════════════
const bgCanvas  = document.getElementById('bg');
const flCanvas  = document.getElementById('flower');
const bgCtx     = bgCanvas.getContext('2d');
const flCtx     = flCanvas.getContext('2d');

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  bgCanvas.width  = flCanvas.width  = W;
  bgCanvas.height = flCanvas.height = H;
}
resize();
window.addEventListener('resize', resize);

// ══════════════════════════════════════════════════════════════════════
//  PARTICLES
// ══════════════════════════════════════════════════════════════════════
class Particle {
  constructor() { this.reset(true); }
  reset(init = false) {
    this.x    = Math.random() * W;
    this.y    = init ? Math.random() * H : H + 10;
    this.vy   = -(Math.random() * 0.5 + 0.1);
    this.vx   = (Math.random() - 0.5) * 0.15;
    this.r    = Math.random() * 1.4 + 0.3;
    this.life = 0;
    this.max  = Math.random() * 220 + 80;
    const hue = Math.random() * 70 + 210;
    this.hsl  = `hsl(${hue},55%,72%)`;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.life++;
    if (this.life > this.max || this.y < -10) this.reset();
  }
  draw(ctx) {
    const a = Math.sin((this.life / this.max) * Math.PI) * 0.45;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle   = this.hsl;
    ctx.shadowBlur  = 5; ctx.shadowColor = this.hsl;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const particles = Array.from({ length: 90 }, () => new Particle());

// ══════════════════════════════════════════════════════════════════════
//  BACKGROUND — ambient radial gradient that shifts with flower color
// ══════════════════════════════════════════════════════════════════════
let bgGlow = { r:20, g:10, b:40, tr:20, tg:10, tb:40 }; // current / target

function drawBackground() {
  bgCtx.clearRect(0, 0, W, H);
  bgCtx.fillStyle = '#05070f';
  bgCtx.fillRect(0, 0, W, H);

  // Lerp toward target color
  bgGlow.r += (bgGlow.tr - bgGlow.r) * 0.008;
  bgGlow.g += (bgGlow.tg - bgGlow.g) * 0.008;
  bgGlow.b += (bgGlow.tb - bgGlow.b) * 0.008;

  const grad = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.65);
  grad.addColorStop(0, `rgba(${bgGlow.r|0},${bgGlow.g|0},${bgGlow.b|0},0.55)`);
  grad.addColorStop(1, 'transparent');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, W, H);

  // Particles on bg canvas
  particles.forEach(p => { p.update(); p.draw(bgCtx); });
}

// ══════════════════════════════════════════════════════════════════════
//  FLOWER DRAWING
// ══════════════════════════════════════════════════════════════════════
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return [r, g, b];
}

function drawFlower(ctx, meta, scale, alpha, flFrame) {
  const fcx = cx, fcy = cy + H * 0.04; // slightly below center
  const S = Math.min(W, H) / 420;      // responsive scale
  const total = S * scale;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(fcx, fcy);
  ctx.scale(total, total);
  ctx.translate(-fcx, -fcy);

  // ── Glow halo ────────────────────────────────────────────────────
  const glowR = 160 + Math.sin(flFrame * 0.025) * 20;
  const [gr, gg, gb] = hexToRgb(meta.petalColor);
  const halo = ctx.createRadialGradient(fcx, fcy, 0, fcx, fcy, glowR);
  halo.addColorStop(0,   `rgba(${gr},${gg},${gb},0.18)`);
  halo.addColorStop(0.5, `rgba(${gr},${gg},${gb},0.06)`);
  halo.addColorStop(1,   'transparent');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(fcx, fcy, glowR, 0, Math.PI * 2);
  ctx.fill();

  // ── Stem ─────────────────────────────────────────────────────────
  ctx.save();
  ctx.strokeStyle = meta.stemColor;
  ctx.lineWidth   = 4;
  ctx.shadowBlur  = 10; ctx.shadowColor = meta.stemColor;
  ctx.beginPath();
  ctx.moveTo(fcx, fcy + 30);
  ctx.bezierCurveTo(fcx + 20, fcy + 90, fcx - 15, fcy + 150, fcx, fcy + 190);
  ctx.stroke();
  ctx.fillStyle = meta.stemColor + 'aa';
  ctx.beginPath();
  ctx.ellipse(fcx + 24, fcy + 115, 22, 10, Math.PI / 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ── Petals (back) ────────────────────────────────────────────────
  const n = meta.petals;
  const petalR  = 80 + Math.sin(flFrame * 0.018) * 4;  // slow breathe
  const petalW  = Math.max(14, 200 / n);
  const petalH  = petalW * 2.2;

  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2 + Math.PI / n;
    drawPetal(ctx, fcx, fcy, ang, petalR, petalW, petalH, meta.petalColor, 0.38, flFrame);
  }
  // ── Petals (front) ───────────────────────────────────────────────
  for (let i = 0; i < n; i++) {
    const ang = (i / n) * Math.PI * 2;
    drawPetal(ctx, fcx, fcy, ang, petalR + 6, petalW + 2, petalH + 4, meta.petalColor, 0.82, flFrame);
  }

  // ── Center ───────────────────────────────────────────────────────
  const pulse = 1 + Math.sin(flFrame * 0.05) * 0.06;
  ctx.save();
  ctx.translate(fcx, fcy);
  ctx.scale(pulse, pulse);
  const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 30);
  cg.addColorStop(0,   'rgba(255,255,255,0.55)');
  cg.addColorStop(0.4,  meta.centerColor);
  cg.addColorStop(1,    meta.centerColor + '55');
  ctx.beginPath(); ctx.arc(0, 0, 30, 0, Math.PI * 2);
  ctx.fillStyle   = cg;
  ctx.shadowBlur  = 40; ctx.shadowColor = meta.centerColor;
  ctx.fill();
  ctx.restore();

  // ── Orbital sparkles ─────────────────────────────────────────────
  for (let i = 0; i < 8; i++) {
    const ang = (i / 8) * Math.PI * 2 + flFrame * 0.012;
    const sr  = 110 + Math.sin(flFrame * 0.04 + i) * 22;
    const sx  = fcx + Math.cos(ang) * sr;
    const sy  = fcy + Math.sin(ang) * sr;
    const sa  = (Math.sin(flFrame * 0.06 + i * 1.3) + 1) * 0.22;
    ctx.save();
    ctx.globalAlpha = sa;
    ctx.fillStyle   = meta.petalColor;
    ctx.shadowBlur  = 12; ctx.shadowColor = meta.petalColor;
    ctx.beginPath(); ctx.arc(sx, sy, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  ctx.restore(); // undo scale+translate+alpha
}

function drawPetal(ctx, ox, oy, angle, radius, pw, ph, color, alpha, flFrame) {
  ctx.save();
  ctx.translate(ox, oy);
  ctx.rotate(angle);
  ctx.globalAlpha = alpha;
  const breathe = 1 + Math.sin(flFrame * 0.022 + angle) * 0.025;
  ctx.scale(breathe, breathe);
  const [r,g,b] = hexToRgb(color);
  const grad = ctx.createRadialGradient(0, -radius * 0.35, 0, 0, -radius, pw);
  grad.addColorStop(0,   `rgba(${r},${g},${b},1)`);
  grad.addColorStop(0.55,`rgba(${r},${g},${b},0.75)`);
  grad.addColorStop(1,   `rgba(${r},${g},${b},0.1)`);
  ctx.beginPath();
  ctx.ellipse(0, -radius, pw, ph, 0, 0, Math.PI * 2);
  ctx.fillStyle  = grad;
  ctx.shadowBlur = 24; ctx.shadowColor = color;
  ctx.fill();
  ctx.restore();
}

// ══════════════════════════════════════════════════════════════════════
//  IDLE WAITING ANIMATION (slow pulsing neutral flower)
// ══════════════════════════════════════════════════════════════════════
const IDLE_META = {
  petals: 8,
  petalColor: '#2a2e4a',
  centerColor: '#1e2035',
  stemColor: '#1a2030',
};

function drawIdle() {
  const a = (Math.sin(frame * 0.015) + 1) * 0.5 * 0.12 + 0.04;
  flCtx.clearRect(0, 0, W, H);
  drawFlower(flCtx, IDLE_META, 1, a, frame);
}

// ══════════════════════════════════════════════════════════════════════
//  MAIN LOOP
// ══════════════════════════════════════════════════════════════════════
function loop() {
  frame++;
  drawBackground();
  flCtx.clearRect(0, 0, W, H);

  if (!current && !incoming) {
    // Idle — no data yet
    drawIdle();
  } else {
    // Transition: fade current out while incoming blooms in
    if (incoming) {
      incoming.bloomScale = Math.min(incoming.bloomScale + 0.025, 1);
      incoming.alpha      = Math.min(incoming.alpha + 0.02, 1);

      if (current) {
        current.alpha = Math.max(current.alpha - 0.025, 0);
        if (current.alpha > 0) drawFlower(flCtx, current.meta, 1, current.alpha, frame);
      }

      drawFlower(flCtx, incoming.meta, incoming.bloomScale, incoming.alpha, frame);

      if (incoming.bloomScale >= 1 && incoming.alpha >= 1) {
        current  = incoming;
        incoming = null;
      }
    } else {
      drawFlower(flCtx, current.meta, 1, 1, frame);
    }
  }

  animId = requestAnimationFrame(loop);
}
loop();

// ══════════════════════════════════════════════════════════════════════
//  LABEL HELPERS
// ══════════════════════════════════════════════════════════════════════
function showLabel(meta) {
  const el   = document.getElementById('label');
  const name = document.getElementById('flowerName');
  const sub  = document.getElementById('flowerSub');
  name.textContent = meta.name;
  sub.textContent  = meta.sub;
  name.style.color = meta.petalColor;
  name.style.textShadow = `0 0 40px ${meta.petalColor}88`;
  el.classList.add('visible');

  clearTimeout(labelTimer);
  labelTimer = setTimeout(() => el.classList.remove('visible'), 5000);
}

// ══════════════════════════════════════════════════════════════════════
//  SOCKET.IO — receive realtime updates
// ══════════════════════════════════════════════════════════════════════
const socket = io(SERVER, {
  query: { client: 'touchdesigner-display' },
  reconnectionAttempts: Infinity,
  reconnectionDelay: 2000,
});

socket.on('connect', () => {
  console.log('[FlowerDisplay] Connected', socket.id);
  document.getElementById('waiting').classList.remove('hidden');
});

socket.on('flower_result', (data) => {
  const meta = FLOWER_META[data.flowerType];
  if (!meta) return;

  console.log('[FlowerDisplay] New flower:', data.flowerType);

  // Hide waiting message forever
  document.getElementById('waiting').classList.add('hidden');

  // Set background glow target from flower color
  const [r, g, b] = hexToRgb(meta.petalColor);
  bgGlow.tr = r * 0.15;
  bgGlow.tg = g * 0.12;
  bgGlow.tb = b * 0.22 + 20;

  // Queue transition
  incoming = { meta, bloomScale: 0, alpha: 0 };

  // Show name label briefly
  showLabel(meta);
});

socket.on('disconnect', () => {
  console.log('[FlowerDisplay] Disconnected — will reconnect');
});

// ══════════════════════════════════════════════════════════════════════
//  TD-FRIENDLY: also accept postMessage from parent TD browser comp
// ══════════════════════════════════════════════════════════════════════
window.addEventListener('message', (e) => {
  if (e.data && e.data.flowerType) {
    socket.emit('flower_result', e.data); // relay through socket event handler
    const evt = new CustomEvent('flower_result_local', { detail: e.data });
    window.dispatchEvent(evt);
  }
});
window.addEventListener('flower_result_local', (e) => {
  const data = e.detail;
  const meta = FLOWER_META[data.flowerType];
  if (!meta) return;
  document.getElementById('waiting').classList.add('hidden');
  const [r, g, b] = hexToRgb(meta.petalColor);
  bgGlow.tr = r * 0.15; bgGlow.tg = g * 0.12; bgGlow.tb = b * 0.22 + 20;
  incoming = { meta, bloomScale: 0, alpha: 0 };
  showLabel(meta);
});
</script>
</body>
</html>
